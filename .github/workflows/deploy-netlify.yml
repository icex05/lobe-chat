name: Deploy LobeChat to Netlify

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # ⚡ 核心修复：删掉了 version: 9，让它自动根据 package.json 锁定的 pnpm v12 进行安装

      - name: Install Dependencies
        run: pnpm install

      - name: Build Netlify Next.js Artifacts
        run: npx netlify build --filter=@lobehub/lobehub
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NODE_OPTIONS: "--max-old-space-size=6144"

      - name: Deploy to Netlify Production
        run: npx netlify deploy --prod --filter=@lobehub/lobehub
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
